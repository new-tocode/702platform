# 702platform Nginx 站点配置（由 deploy/install.sh 从模板生成，勿手工修改）
# 安放位置: /etc/nginx/sites-available/club702 -> sites-enabled/

server {
    listen 80;
    server_name @@SERVER_NAME@@;

    # 放行最大 500MB 的视频上传（MEDIA 上限 500MB，留一点余量）
    client_max_body_size 520m;

    # 静态与媒体由 Nginx 直接服务，不经过 Python 进程
    location /static/ {
        alias @@APP_DIR@@/staticfiles/;
        expires 7d;
        access_log off;
    }
    location /media/ {
        alias @@APP_DIR@@/mediafiles/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://@@APP_HOST@@:@@APP_PORT@@;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;   # 视频上传耗时较长，放宽读超时
    }
}