# Nginx 站点模板（HTTP 阶段）。执行 `certbot --nginx -d <域名>` 后
# certbot 会自动改写本文件加入 443/HTTPS 和跳转，无需手工维护。
# 安放位置: /etc/nginx/sites-available/club702 -> sites-enabled/ 软链

server {
    listen 80;
    server_name club.example.com;   # 改为实际域名

    # 放行最大 500MB 的视频上传（ MEDIA 上限 500MB，留一点余量）
    client_max_body_size 520m;

    # 静态与媒体由 Nginx 直接服务，不经过 Python 进程
    location /static/ {
        alias /opt/702platform/staticfiles/;
        expires 7d;
        access_log off;
    }
    location /media/ {
        alias /opt/702platform/mediafiles/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;   # 视频上传耗时较长，放宽读超时
    }
}
