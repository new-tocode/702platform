# 702platform Nginx 站点配置（由 deploy/install.sh 按系统类型生成，勿手工修改）
# 配置路径: Debian 系 sites-available -> sites-enabled；RHEL 系 conf.d/club702.conf
# HTTPS 块（@@HTTPS_BLOCK_START@@ ... @@HTTPS_BLOCK_END@@）仅在 env.sh 配置
#   SSL_CERT_PATH/SSL_KEY_PATH 时启用（监听 443）；否则该块会被删除，仅监听 HTTP 80。
#
# 两个 server 块是同构的：install.sh 按整块删 HTTPS 段，所以同一处改动要**同时**
# 落在两块里，只改一处会留下「开着 https 反而少一层防护」的裂缝。

server {
    listen 80;
    listen [::]:80;
    server_name @@SERVER_NAME@@;

    # 放行最大 500MB 的视频上传（MEDIA 上限 500MB，留一点余量）
    client_max_body_size 520m;

    # 点开头的路径一律不外发：.git/ 随代码一起落在应用目录里，放出去等于
    # 把全部源码历史（含历史上出现过的口令串）交出去；.github/ 里也有内部
    # 信息。.well-known 留给 ACME 之类的标准用途，照常放行。
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # ACME http-01 挑战：certbot 把验证文件写进这个 webroot，Nginx 直接回给对方。
    # 没有这条，请求会落到 location / 被反代给 Django 而 404 —— 签发的报错会写成
    # 「验证文件取不到」，看上去像网络问题，实际是这条 location 没配。
    # ^~ 前缀匹配优先于正则与普通前缀，所以不会被 location / 抢走；上面那条
    # 「点开头一律拒绝」本来就豁免 .well-known（`(?!well-known)`），两者不冲突。
    location ^~ /.well-known/acme-challenge/ {
        root @@ACME_WEBROOT@@;
        default_type "text/plain";
        access_log off;
    }

    # 静态与**公开**媒体由 Nginx 直接服务，不经过 Python 进程。
    # /media/ 只映射 mediafiles/（媒体库配图这类本就公开的内容）；受保护的上传件
    # 在 protected_media/，**刻意不在这个目录之下**，所以没有任何 HTTP 路径能直接
    # 取到它们——项目书、批注版、头像、图册一律经视图送出。
    location /static/ {
        alias @@APP_DIR@@/staticfiles/;
        expires 7d;
        access_log off;
    }
    location /media/ {
        alias @@APP_DIR@@/mediafiles/;
        expires 7d;
        access_log off;
    }

    # 登录入口限流。zone 定义在 nginx.conf 的 http 块里（install.sh 会幂等追加，
    # 因为站点配置身处 http 块内部、写不进 http 上下文）。这里只引用。
    #
    # 20 次/分钟/IP：正常人不会一分钟登 20 次，而脚本爆破会被这条挡住。burst 留 5
    # 给手误重试，nodelay 让突发内的请求立刻过而不是排队——排队只会让攻击者用
    # 慢速连接占住 worker。阈值放宽是因为成员常在小范围内共用出口 IP，太严会误伤。
    location = /login/ {
        limit_req zone=club702_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://@@APP_HOST@@:@@APP_PORT@@;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 覆写而不是追加（$proxy_add_x_forwarded_for）：本站只有这一级代理，
        # 追加会把客户端自带的 X-Forwarded-For 原样接在前面，下游若取首段就能
        # 伪造来源。覆写之后这个头里只有 nginx 亲眼看到的对端地址。
        # 应用侧由 DJANGO_TRUST_FORWARDED_FOR=1 决定信不信它，两个开关配套。
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /admin/login/ {
        limit_req zone=club702_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://@@APP_HOST@@:@@APP_PORT@@;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 覆写而不是追加（$proxy_add_x_forwarded_for）：本站只有这一级代理，
        # 追加会把客户端自带的 X-Forwarded-For 原样接在前面，下游若取首段就能
        # 伪造来源。覆写之后这个头里只有 nginx 亲眼看到的对端地址。
        # 应用侧由 DJANGO_TRUST_FORWARDED_FOR=1 决定信不信它，两个开关配套。
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        proxy_pass http://@@APP_HOST@@:@@APP_PORT@@;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 覆写而不是追加（$proxy_add_x_forwarded_for）：本站只有这一级代理，
        # 追加会把客户端自带的 X-Forwarded-For 原样接在前面，下游若取首段就能
        # 伪造来源。覆写之后这个头里只有 nginx 亲眼看到的对端地址。
        # 应用侧由 DJANGO_TRUST_FORWARDED_FOR=1 决定信不信它，两个开关配套。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;   # 视频上传耗时较长，放宽读超时
    }
}

@@HTTPS_BLOCK_START@@
server {
    # **default_server 不能省。** 访问 https://<IP> 时浏览器**不发 SNI**（RFC 6066
    # 不允许 SNI 里放 IP 字面量），nginx 于是拿不到 server_name 可比，只能回落到该端口
    # 的默认 server——没有显式声明时，那就是配置顺序里的第一个（同机上还有别人的站点，
    # 它不是本平台）。结果就是：IP 证书签得再对也**根本用不上**，客户端拿到的是别人的
    # 证书，浏览器照样报错。声明成默认 server 之后，无 SNI 的握手用本平台的证书，
    # 而带 SNI 的请求（例如访问 alenapi.xyz）照旧按 server_name 路由，互不影响。
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name @@SERVER_NAME@@;

    ssl_certificate @@SSL_CERT_PATH@@;
    ssl_certificate_key @@SSL_KEY_PATH@@;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 放行最大 500MB 的视频上传（MEDIA 上限 500MB，留一点余量）
    client_max_body_size 520m;

    # 点开头的路径一律不外发：.git/ 随代码一起落在应用目录里，放出去等于
    # 把全部源码历史（含历史上出现过的口令串）交出去；.github/ 里也有内部
